name: deploy-funzocoinkids_landing
run-name: ${{ github.actor }} is deploying funzocoinkids_landing

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |

            set -euo pipefail

            DEPLOY_BASE="/var/www/${{ secrets.DOMAIN }}"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            RELEASE_DIR="$DEPLOY_BASE/releases/$TIMESTAMP"
            CURRENT_LINK="$DEPLOY_BASE/current"
            mkdir -p "$DEPLOY_BASE/releases"

            # Clone the repository into the release directory
            git clone --depth 1 --branch master --single-branch https://${{ secrets.USER_KEY }}@github.com/nickfff-dev/funzocoinkids_landing.git "$RELEASE_DIR"
            cd "$RELEASE_DIR"

            cat <<EOF > .env.local
            NEXT_PUBLIC_LANDING_URL=${{ secrets.NEXT_PUBLIC_LANDING_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NODE_ENV=production
            EOF

            # Setup Node environment
            set +u
            export NVM_DIR="/home/${{ secrets.USERNAME }}/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use --lts
            set -u


            # Explicitly set PNPM_HOME and put it on PATH — non-interactive SSH
            # sessions don't source .bashrc, so `pnpm setup`'s changes never apply here.
            export PNPM_HOME="/home/${{ secrets.SERVER_USERNAME }}/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"

            # Ensure pnpm is installed
            if ! command -v pnpm &> /dev/null; then
              curl -fsSL https://get.pnpm.io/install.sh | env PNPM_HOME="$PNPM_HOME" sh -
            fi

            # Ensure pm2 is installed
            command -v pm2 &> /dev/null || npm install -g pm2

            pnpm install
            export NEXT_DEPLOYMENT_ID=$(git rev-parse HEAD)
            export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)


            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            # PM2 reload/start
            if pm2 ls | grep -qw '\s${{ secrets.DOMAIN }}'; then
              pm2 reload ${{ secrets.DOMAIN }} --time --update-env --cwd "$CURRENT_LINK"
            else
              pm2 start pnpm --time --cwd "$CURRENT_LINK" --name "${{ secrets.DOMAIN }}" -- start
            fi
            pm2 save

            # Clean up old releases, keeping last 3
            cd "$DEPLOY_BASE/releases"
            ls -1tr | head -n -3 | xargs -d '\n' rm -rf --
